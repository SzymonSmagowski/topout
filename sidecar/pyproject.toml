[tool.poetry]
name = "topout-sidecar"
version = "0.1.0"
description = "Python LangGraph sidecar for the TopOut bouldering coach. FastAPI + pandas + OpenAI."
authors = ["Szymon Smagowski <smagowski.szymon@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
fastapi = "^0.136.0"
uvicorn = { extras = ["standard"], version = "^0.44.0" }
pydantic = "^2.13.2"
pydantic-settings = "^2.13.1"

# LLM stack — same versions as portfolio-ai-lab to stay consistent.
langchain = "^1.2.15"
langchain-core = "^1.3.0"
langchain-openai = "^1.1.14"
langgraph = "^1.1.8"
openai = "^2.26.0"

# Observability — single source of truth for LLM traces (graph nodes + LLM calls).
# Graceful no-op when keys are unset, so local dev / CI keep running without it.
langfuse = "^3.0"

# Analytics
pandas = "^2.2.3"
numpy = "^2.2.1"

# HTTP + utilities
httpx = "^0.28.1"
tenacity = "^9.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-asyncio = "^1.3.0"
pytest-cov = "^7.1.0"
respx = "^0.21.1"
mypy = "^1.13.0"
ruff = "^0.8.1"
black = "^24.10.0"
types-python-dateutil = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ---------------------------------------------------------------------------
# Lint / format / typecheck — manifest's Python mirror of the TS quality bar.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Aggressive defaults; we lean on mypy --strict for the rest.
select = [
    "E", "F", "W",          # pycodestyle / pyflakes / warnings
    "I",                    # isort
    "B",                    # bugbear
    "UP",                   # pyupgrade
    "SIM",                  # simplify
    "ANN",                  # annotations — required by mypy --strict anyway
    "RUF",                  # ruff-specific
]
ignore = [
    "ANN401",   # Allow `Any` in narrow cases (LangGraph state dict patches).
    "RUF001",   # Ambiguous unicode chars in strings (en/em dash) are intentional.
    "RUF002",   # Same, for docstrings.
    "B008",     # FastAPI dependency injection uses `= Depends(...)` by design.
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
strict = true
python_version = "3.12"
disallow_any_generics = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pandas.*", "langgraph.*", "langchain.*", "langchain_openai.*", "openai.*", "langfuse.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
